[package]
name = "app"
version = "1.5.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# `devtools`: habilita las herramientas de desarrollador TAMBIÉN en las builds de
# producción (por defecto solo existen en debug). Son útiles para que el usuario
# escriba su propio CSS o depure el uso diario; se abren con F12 / Ctrl+Shift+I.
tauri = { version = "2.11.3", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
# Watcher del vault en carpeta (fase 5): observa la carpeta y agrupa las ráfagas
# de eventos del SO. `notify-debouncer-full` trae `notify` v6 como dependencia.
notify-debouncer-full = "0.3"
# Terminal integrada (FUN-L-07): pseudo-terminal multiplataforma (ConPTY en Windows).
portable-pty = "0.9"
# Autoactualización (FUN-L-14) y selección de versión (FUN-M-16): descarga,
# verificación de la firma, instalación y reinicio. Se fija la MINOR porque
# `version_comparator` —lo que permite instalar una versión anterior— es API
# suya y no queremos que se mueva sola.
tauri-plugin-updater = "2.10"
# Solo para leer `versions.json` (FUN-M-16), que el plugin del updater no
# conoce. MISMAS features que las que él activa, para que cargo unifique y no
# se compile reqwest dos veces ni se cuele native-tls.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
# Con `rustls-no-provider` el backend criptográfico NO se autoinstala: hay que
# fijar el proveedor por defecto del proceso antes del primer TLS propio.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
trash = "5.2.3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

# Solo para el test headless del data layer (misma sqlx/SQLite que usa el plugin).
[dev-dependencies]
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

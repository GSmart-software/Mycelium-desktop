[package]
name = "app"
version = "2.6.0"
description = "A Tauri App"
authors = ["you"]
license = "MIT"
repository = "https://github.com/GSmart-software/Mycelium-desktop"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# Workspace (FUN-L-09): la app es el paquete RAÍZ y los crates del servidor MCP
# viven en `crates/`. Así el directorio `target/` y el `Cargo.lock` siguen donde
# estaban y `tauri build` / `tauri dev` no se enteran: en la raíz de un workspace
# con paquete raíz, `cargo build` compila solo ese paquete. Para todo el
# workspace: `cargo test --workspace`.
#   - `crates/mycelium-vault`: lo que el servidor necesita saber de los vaults
#     (registro `vaults.json`, rutas canónicas, `hashRuta`).
#   - `crates/mycelium-mcp`: el servidor MCP de control, un binario aparte.
# Desde la Parte 1 la app depende de `mycelium-vault` (el canal de control,
# `src/control.rs`); el resto de su código de vault sigue en `src/`.
[workspace]
members = [".", "crates/mycelium-vault", "crates/mycelium-mcp"]
resolver = "2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# `devtools`: compila las herramientas de desarrollador TAMBIÉN en las builds de
# producción (por defecto solo existen en debug). Se abren con F12 / Ctrl+Shift+I
# solo si el vault de la ventana tiene encendido «Herramientas de desarrollo» en
# esta máquina (src/devtools.rs); en desarrollo, siempre.
# `protocol-asset`: sirve archivos del disco al webview por el esquema `asset:`
# (FUN-L-11). Sin esta feature el protocolo no se registra y `convertFileSrc`
# devuelve una URL que no responde. El ámbito NO es global: se abre en runtime,
# carpeta por carpeta, al registrar un vault (ver `ventanas::registrar_vault`).
tauri = { version = "2.11.3", features = ["devtools", "protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
# Abrir un enlace en el navegador PREDETERMINADO del sistema (`FUN-S-20`). Antes
# un `[texto](https://…)` navegaba la propia ventana y se llevaba la app entera
# (`DEF-101`): el marco es propio, así que no quedaba ni barra de dirección ni
# forma de volver al vault.
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
# Watcher del vault en carpeta (fase 5): observa la carpeta y agrupa las ráfagas
# de eventos del SO. `notify-debouncer-full` trae `notify` v6 como dependencia.
notify-debouncer-full = "0.3"
# Terminal integrada (FUN-L-07): pseudo-terminal multiplataforma (ConPTY en Windows).
portable-pty = "0.9"
# Autoactualización (FUN-L-14) y selección de versión (FUN-M-16): descarga,
# verificación de la firma, instalación y reinicio. Se fija la MINOR porque
# `version_comparator` —lo que permite instalar una versión anterior— es API
# suya y no queremos que se mueva sola.
tauri-plugin-updater = "2.10"
# Solo para leer `versions.json` (FUN-M-16), que el plugin del updater no
# conoce. MISMAS features que las que él activa, para que cargo unifique y no
# se compile reqwest dos veces ni se cuele native-tls.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
# Con `rustls-no-provider` el backend criptográfico NO se autoinstala: hay que
# fijar el proveedor por defecto del proceso antes del primer TLS propio.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# Diccionarios del corrector ortográfico (`FUN-L-12`, src/diccionarios.rs): se
# publican en gzip y se descomprimen mientras bajan, verificando el sha256 de
# lo descomprimido. Las dos ya estaban en el árbol (updater, zip): no se
# compila nada nuevo.
flate2 = "1"
sha2 = "0.10"
# Importar un `.zip` (`DEF-165`, src/archivos.rs): lo extrae Rust para pasarle a
# cada archivo la marca de la web del zip. Ya estaba en el árbol (el updater);
# solo se le suma `deflate-flate2`, sobre el `flate2` de arriba.
zip = { version = "4", default-features = false, features = ["deflate-flate2"] }
# Comparar versiones en el control de bajada del updater (src/actualizador.rs):
# es el tipo que usa el plugin en `version_comparator`. Ya estaba en el árbol
# (el updater): no se compila nada nuevo.
semver = "1"
trash = "5.2.3"
# Recordatorios del calendario (`FUN-L-22`): la notificación del sistema cuando
# la ventana está minimizada, sin foco o tapada. La tarjeta propia se ve adentro.
# En Windows el toast se arma con `tauri-winrt-notification` (abajo) para poder
# atender el clic; el plugin queda para los demás sistemas.
tauri-plugin-notification = "2"
# MCP de control (`FUN-L-09`, src/control.rs): lo que la app comparte con el
# servidor `mycelium-mcp` —el nombre del canal, la resolución contra el
# registro, el hash— vive en este crate del workspace, para que las dos puntas
# no se puedan desalinear.
mycelium-vault = { path = "crates/mycelium-vault" }
# La escucha del canal (named pipe / socket) corre en el runtime que ya trae
# Tauri; se piden solo las features que faltan (`net`, `macros`). Misma versión:
# no se compila dos veces.
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "macros", "rt"] }
# El índice de cada vault lo abre Rust y no la webview (`DEF-166`, `src/indice.rs`):
# se arma el pool con las mismas versiones que ya trae `tauri-plugin-sql` y se le
# entrega por su estado público. `libsqlite3-sys`, para el autorizador que impide
# `ATTACH` y `VACUUM INTO` (crear bases en cualquier carpeta). Sin features
# propias: las fija sqlx, y así no se compila una segunda copia de SQLite.
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }
libsqlite3-sys = { version = "0.30", default-features = false }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

# Menú de anclaje de Windows 11 con marco propio (FUN-M-31, src/marco.rs): hay
# que contestar a mano el mensaje con el que Windows pregunta qué hay bajo el
# puntero. Misma versión que ya traen tao/wry, para no compilar dos copias.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  # El descriptor de seguridad del canal de control (src/control.rs).
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Threading",
  "Win32_System_LibraryLoader",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
# El toast de un recordatorio con manejador de clic (`FUN-L-22`, src/recordatorios.rs).
# Misma versión que trae `tauri-plugin-notification` por debajo: no se compila dos veces.
tauri-winrt-notification = "0.7"
# Las DevTools por vault (src/devtools.rs): `SetAreDevToolsEnabled` sobre el
# controlador de WebView2, por webview y en tiempo de ejecución. Misma versión
# que trae wry: no se compila dos veces.
webview2-com = "0.38"

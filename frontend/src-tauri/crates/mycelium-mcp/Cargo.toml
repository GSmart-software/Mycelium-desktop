[package]
name = "mycelium-mcp"
version = "0.1.0"
description = "Servidor MCP de control de Mycelium: deja a la IA del vault operar la app"
edition = "2021"
rust-version = "1.77.2"
publish = false

# Binario aparte (`FUN-L-09`, ver `docs/features/mcp-control.md`). Habla MCP
# por stdio (JSON-RPC 2.0, un mensaje por línea) implementado a mano: ver el
# porqué en `src/protocolo.rs`. Sin runtime asíncrono.
#
# Empaquetado (Parte 1): va como `bundle.externalBin` de Tauri (sidecar), que
# exige `binaries/mycelium-mcp-<target-triple>.exe` al compilar y lo instala
# junto a `Mycelium.exe` como `mycelium-mcp.exe`. Lo compila y lo deja ahí
# `scripts/preparar-mcp.mjs` (en el `beforeBuildCommand`/`beforeDevCommand`).

[[bin]]
name = "mycelium-mcp"
path = "src/main.rs"

[dependencies]
mycelium-vault = { path = "../mycelium-vault" }
serde_json = "1.0"

# Solo para los tests: el servidor de canal falso (`src/canal_falso.rs`) crea un
# named pipe de verdad. Misma versión que ya usa la app: no se compila dos veces.
[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Pipes",
] }

[package]
name = "mycelium-mcp"
version = "0.1.0"
description = "Servidor MCP de memoria de Mycelium: búsqueda y lectura por sección sobre un índice propio"
edition = "2021"
rust-version = "1.77.2"
publish = false

# Binario delgado encima de `mycelium-vault` (FUN-L-09). Habla MCP por stdio
# (JSON-RPC 2.0, un mensaje por línea) implementado a mano: ver el porqué en
# `src/protocolo.rs`. Sin runtime asíncrono.
#
# Empaquetado (todavía sin cablear): va como `bundle.externalBin` de Tauri
# (sidecar), que exige `binaries/mycelium-mcp-<target-triple>.exe` al compilar y
# lo instala junto a `Mycelium.exe` como `mycelium-mcp.exe`. El nombre del
# binario ya es ese, y comparte `target/` con la app por estar en el workspace.

[[bin]]
name = "mycelium-mcp"
path = "src/main.rs"

[dependencies]
mycelium-vault = { path = "../mycelium-vault", features = ["indice"] }
serde_json = "1.0"

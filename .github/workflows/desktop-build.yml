name: Desktop (Tauri) build

# Empaqueta la app de escritorio para Windows, Linux y macOS SIN firmar.
# - push de un tag `v*`  → crea un Release (borrador) con los instaladores.
# - ejecución manual     → solo compila y sube los artefactos del run.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: ""
          - os: macos-latest
            target: "aarch64-apple-darwin"
          - os: ubuntu-22.04
            target: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias de sistema (Linux/WebKitGTK)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf build-essential libssl-dev libgtk-3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Instalar dependencias del frontend
        working-directory: frontend
        run: npm ci

      - name: Compilar y empaquetar (tauri-action)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: frontend
          args: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
          # Solo crea Release cuando el disparador es un tag.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('Mycelium {0}', github.ref_name) || '' }}
          releaseDraft: true
          prerelease: false

      # En ejecución manual (sin tag) subimos los instaladores como artefacto del run.
      - name: Subir artefactos (ejecución manual)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: mycelium-${{ matrix.os }}
          path: |
            frontend/src-tauri/target/**/release/bundle/**/*
          if-no-files-found: ignore

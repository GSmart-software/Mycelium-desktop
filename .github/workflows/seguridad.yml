name: Seguridad de dependencias

# Auditoría de dependencias con avisos conocidos:
# - npm: `npm audit` sobre lo que se empaqueta (sin las de desarrollo), falla
#   con avisos de severidad alta o crítica.
# - Rust: `cargo audit` contra la base de RustSec. Los avisos aceptados, con su
#   motivo, están en `frontend/src-tauri/.cargo/audit.toml`.
# Corre en cada cambio y una vez por semana, porque los avisos nuevos aparecen
# sin que cambie el código.
#
# Lo llama también `desktop-build.yml` (`workflow_call`) antes de compilar: con
# un aviso alto o crítico no se generan instaladores (regla del usuario,
# 2026-10-26).
on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # `npm audit` lee el `package-lock.json`: no hace falta instalar nada.
      - name: Auditar dependencias de producción
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      # El mismo SBOM que genera `desktop-build.yml` al compilar, pero desde el
      # lockfile y en cada cambio: si el árbol queda inconsistente (un override
      # que npm 11 no acepta, como pasó con la 2.6.0), falla acá y no recién en
      # el release.
      - name: SBOM de dependencias de producción
        working-directory: frontend
        run: |
          npm sbom --package-lock-only --sbom-format cyclonedx --omit dev --legacy-peer-deps > "$RUNNER_TEMP/sbom.cdx.json"
          node -e 'const b=require(process.argv[1]); if (b.bomFormat!=="CycloneDX"||!b.components?.length) process.exit(1); console.log(`frontend: ${b.components.length} componentes`)' "$RUNNER_TEMP/sbom.cdx.json"

  cargo:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-audit

      - name: Auditar Cargo.lock
        working-directory: frontend/src-tauri
        run: cargo audit

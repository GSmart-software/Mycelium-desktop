# Actualizaciones de dependencias con Dependabot.
#
# Una vez por semana, agrupadas por ecosistema para no llenar el repo de PRs: las
# subidas menores y de parche van juntas en un solo PR por ecosistema. Las alertas
# de seguridad (Dependabot security updates) se activan aparte, en Settings → Code
# security, y abren su PR en cuanto sale el aviso, sin esperar a la semana.
#
# Los PRs van a `main`, donde se desarrolla y se prueba: `despliegues` solo recibe
# el PR del release, que compila los instaladores. Las subidas MAYORES no se
# proponen: pueden romper algo (TypeScript, Mermaid, la API de Windows que fija
# Tauri) y se deciden a mano (decisión del usuario, 2026-11-02, al cerrar los 11
# PRs que apuntaban a `despliegues`).
#
# Ojo: Dependabot lee este archivo de la rama PREDETERMINADA del repo. Mientras esa
# sea `despliegues`, la configuración rige recién cuando llega ahí con un release.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Argentina/Buenos_Aires
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm-menores:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /frontend/src-tauri
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Argentina/Buenos_Aires
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      cargo-menores:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Argentina/Buenos_Aires
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      acciones:
        patterns: ["*"]

# Blueprint de Render para el backend .NET (modo Cloudflare).
# Importar desde el dashboard de Render (Blueprints) o vía `render blueprint launch`.
# Los valores marcados `sync: false` se piden en el dashboard (secretos): no se
# commitean. El frontend NO va aquí: se despliega en Cloudflare Pages.

services:
  - type: web
    name: micelio-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Storage__Provider
        value: cloudflare

      # Cloudflare D1 + R2
      - key: Cloudflare__AccountId
        sync: false
      - key: Cloudflare__ApiToken
        sync: false
      - key: Cloudflare__D1__DatabaseId
        sync: false
      - key: Cloudflare__R2__Bucket
        value: micelio-blobs
      - key: Cloudflare__R2__AccessKeyId
        sync: false
      - key: Cloudflare__R2__SecretAccessKey
        sync: false

      # Autenticación
      - key: Jwt__Secret
        sync: false
      - key: Jwt__Issuer
        value: micelio

      # CORS: URL exacta del frontend en Pages (sin barra final)
      - key: Cors__FrontendOrigin
        sync: false

      # Cookies cross-site (Pages <-> Render). Con dominio propio en subdominios
      # se puede usar Lax + Auth__CookieDomain=.midominio.com en su lugar.
      - key: Auth__CookieSameSite
        value: None
      - key: Auth__CookieSecure
        value: "true"

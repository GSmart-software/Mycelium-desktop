<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mycelium</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='9' cy='10' r='4' fill='%2325f0c8'/%3E%3Ccircle cx='23' cy='8' r='3' fill='%2319e6ff'/%3E%3Ccircle cx='16' cy='23' r='4' fill='%232f8fff'/%3E%3Cpath d='M9 10L23 8M9 10L16 23M23 8L16 23' stroke='%2325f0c8' stroke-width='1.5' opacity='.6'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true">
            <path d="M9 10L23 8M9 10L16 23M23 8L16 23" stroke="var(--accent)" stroke-width="1.5" opacity=".55"/>
            <circle cx="9" cy="10" r="4" fill="#25f0c8"/>
            <circle cx="23" cy="8" r="3" fill="#19e6ff"/>
            <circle cx="16" cy="23" r="4" fill="#2f8fff"/>
          </svg>
          <span>Mycelium</span>
        </div>
      </div>

      <div class="sidebar-actions">
        <button id="btn-open-folder" class="action-btn" title="Abrir una carpeta de tu PC como bóveda">
          <svg viewBox="0 0 24 24"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
          Abrir carpeta
        </button>
        <button id="btn-import" class="action-btn" title="Importar archivos .md sueltos">
          <svg viewBox="0 0 24 24"><path d="M12 16V4m0 12-4-4m4 4 4-4M4 20h16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Importar notas
        </button>
        <button id="btn-new-note" class="action-btn" title="Crear una nota nueva">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          Nueva nota
        </button>
        <button id="btn-graph" class="action-btn" title="Ver el grafo de conexiones">
          <svg viewBox="0 0 24 24"><circle cx="6" cy="7" r="2.4" fill="currentColor"/><circle cx="18" cy="6" r="2" fill="currentColor"/><circle cx="12" cy="18" r="2.4" fill="currentColor"/><path d="M6 7l12-1M6 7l6 11M18 6l-6 12" stroke="currentColor" stroke-width="1.3" opacity=".6"/></svg>
          Grafo
        </button>
      </div>

      <div id="file-tree" class="file-tree"></div>
      <div class="sidebar-footer" id="vault-info"></div>
    </aside>

    <main id="workspace"></main>
  </div>

  <div id="drop-overlay"><div>Suelta tus archivos .md aquí</div></div>
  <div id="toast"></div>
  <input type="file" id="file-input" multiple accept=".md,.markdown,.txt" hidden>

  <script src="js/markdown.js"></script>
  <script src="js/vault.js"></script>
  <script src="js/panes.js"></script>
  <script src="js/graph.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
